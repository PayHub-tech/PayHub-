<script>
/* PayHub V14.1.1 — 强制取消旧版收银台 prompt */
(function () {
  "use strict";

  /* 禁止旧版 openOrder 弹出“收银台链接（复制给客户）” */
  window.openOrder = async function (no) {
    try {
      const d = await api("/api/orders/" + encodeURIComponent(no));
      const o = d.order;

      if (o && o.orderNo) {
        window.location.replace(
          "/checkout/" + encodeURIComponent(o.orderNo) + "?v=1411"
        );
      }
    } catch (e) {
      if (typeof toast === "function") {
        toast(e.message || "打开订单失败");
      } else {
        alert(e.message || "打开订单失败");
      }
    }
  };

  /* 分享付款 */
  window.shareOrder = async function (no) {
    const url =
      location.origin +
      "/checkout/" +
      encodeURIComponent(no) +
      "?v=1411";

    const title = "PayHub 付款";
    const text = "请点击下面链接完成付款：";

    try {
      if (navigator.share) {
        await navigator.share({
          title: title,
          text: text,
          url: url
        });
        return;
      }

      if (
        navigator.clipboard &&
        window.isSecureContext
      ) {
        await navigator.clipboard.writeText(url);

        if (typeof toast === "function") {
          toast("付款链接已复制，可以发送给客户");
        } else {
          alert("付款链接已复制，可以发送给客户");
        }

        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = url;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";

      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      document.execCommand("copy");

      textarea.remove();

      if (typeof toast === "function") {
        toast("付款链接已复制，可以发送给客户");
      } else {
        alert("付款链接已复制，可以发送给客户");
      }

    } catch (e) {
      if (e && e.name === "AbortError") return;

      if (typeof toast === "function") {
        toast("分享失败，请重试");
      } else {
        alert("分享失败，请重试");
      }
    }
  };

  /* 创建订单后直接进入收银台 */
  window.createOrder = async function () {
    try {
      const d = await api("/api/orders", {
        method: "POST",
        body: JSON.stringify({
          merchantOrderNo:
            document.getElementById("merchantOrderNo")?.value ||
            "SHOP-" + Date.now(),

          amount:
            document.getElementById("amount")?.value,

          currency:
            document.getElementById("currency")?.value || "CNY",

          channel:
            document.getElementById("channel")?.value || "mock",

          subject:
            document.getElementById("subject")?.value ||
            "PayHub 商品",

          expiresMinutes:
            document.getElementById("expires")?.value || 30
        })
      });

      const o = d.order;

      if (!o || !o.orderNo) {
        throw new Error("订单创建失败");
      }

      if (typeof toast === "function") {
        toast("订单创建成功，正在打开收银台…");
      }

      setTimeout(function () {
        window.location.replace(
          "/checkout/" +
          encodeURIComponent(o.orderNo) +
          "?v=1411"
        );
      }, 250);

    } catch (e) {
      if (typeof toast === "function") {
        toast(e.message || "创建订单失败");
      } else {
        alert(e.message || "创建订单失败");
      }
    }
  };

  /*
   * 清理旧版页面缓存
   * 下一次进入 dashboard 时自动带版本号
   */
  if (
    location.pathname === "/dashboard.html" &&
    !location.search.includes("v=1411")
  ) {
    const url =
      location.pathname +
      "?v=1411";

    window.history.replaceState({}, "", url);
  }

})();
</script>
