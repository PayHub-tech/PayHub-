<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>PayHub</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f7fb;
  font-family:-apple-system,BlinkMacSystemFont,
              "Segoe UI",Roboto,Arial,sans-serif;
  color:#1f2937;
}

.header{
  height:124px;
  background:#1769ff;
  display:flex;
  align-items:flex-end;
  padding:0 30px 30px;
}

.logo{
  color:white;
  font-size:42px;
  font-weight:800;
}

.container{
  width:100%;
  max-width:600px;
  margin:36px auto;
  padding:0 20px;
}

.card{
  background:white;
  border-radius:26px;
  padding:28px;
  box-shadow:0 15px 40px rgba(30,50,80,.08);
}

h2{
  margin:0 0 22px;
  font-size:25px;
}

h3{
  margin:28px 0 14px;
}

label{
  display:block;
  margin:14px 0 7px;
  font-size:14px;
  font-weight:600;
}

input,
select{
  width:100%;
  height:50px;
  border:1px solid #d8dee8;
  border-radius:12px;
  padding:0 14px;
  font-size:16px;
  outline:none;
  background:white;
}

input:focus,
select:focus{
  border-color:#1769ff;
}

button{
  width:100%;
  height:52px;
  border:0;
  border-radius:13px;
  background:#1769ff;
  color:white;
  font-size:16px;
  font-weight:700;
  margin-top:18px;
  cursor:pointer;
}

button.secondary{
  background:#eef3ff;
  color:#1769ff;
}

button.danger{
  background:#ef4444;
}

.status{
  margin-top:18px;
  padding:14px;
  border-radius:12px;
  background:#f4f6f8;
  display:none;
  white-space:pre-wrap;
  word-break:break-word;
}

.status.success{
  display:block;
  background:#ecfdf3;
  color:#087443;
}

.status.error{
  display:block;
  background:#fff1f2;
  color:#c62828;
}

.hidden{
  display:none!important;
}

.order-box{
  margin-top:22px;
  padding:18px;
  background:#f7f9fc;
  border-radius:15px;
}

.order-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:9px 0;
  border-bottom:1px solid #e8edf3;
}

.order-row:last-child{
  border-bottom:0;
}

.order-row span:first-child{
  color:#6b7280;
}

.order-row span:last-child{
  font-weight:600;
  text-align:right;
  word-break:break-all;
}

.link-box{
  margin-top:16px;
  padding:14px;
  background:#eef3ff;
  color:#1769ff;
  border-radius:12px;
  word-break:break-all;
  font-size:14px;
}

.small{
  color:#6b7280;
  font-size:13px;
  line-height:1.6;
}

.top-user{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.user-name{
  font-weight:700;
}

.logout{
  width:auto;
  height:40px;
  padding:0 16px;
  margin:0;
  background:#eef3ff;
  color:#1769ff;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tab{
  flex:1;
  height:45px;
  margin:0;
  background:#f1f4f8;
  color:#555;
}

.tab.active{
  background:#1769ff;
  color:white;
}

@media(max-width:480px){
  .header{
    height:124px;
    padding-left:28px;
  }

  .logo{
    font-size:38px;
  }

  .container{
    margin-top:25px;
    padding:0 15px;
  }

  .card{
    padding:22px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">PayHub</div>
</div>

<div class="container">

  <!-- 登录/注册 -->
  <div id="authCard" class="card">

    <div class="tabs">
      <button id="loginTab"
              class="tab active"
              onclick="showLogin()">
        登录
      </button>

      <button id="registerTab"
              class="tab"
              onclick="showRegister()">
        注册
      </button>
    </div>

    <!-- 登录 -->
    <div id="loginBox">

      <h2>商户登录</h2>

      <label>邮箱</label>
      <input id="loginEmail"
             type="email"
             placeholder="请输入邮箱">

      <label>密码</label>
      <input id="loginPassword"
             type="password"
             placeholder="请输入密码">

      <button onclick="login()">
        登录
      </button>

    </div>

    <!-- 注册 -->
    <div id="registerBox" class="hidden">

      <h2>注册 PayHub 商户</h2>

      <label>商户名称</label>
      <input id="registerName"
             type="text"
             placeholder="例如：我的店铺">

      <label>邮箱</label>
      <input id="registerEmail"
             type="email"
             placeholder="请输入邮箱">

      <label>密码</label>
      <input id="registerPassword"
             type="password"
             placeholder="至少 6 位密码">

      <button onclick="register()">
        注册
      </button>

    </div>

    <div id="authStatus" class="status"></div>

  </div>


  <!-- 商户页面 -->
  <div id="merchantCard"
       class="card hidden">

    <div class="top-user">

      <div>
        <div class="small">当前商户</div>
        <div id="userName"
             class="user-name">
          -
        </div>
      </div>

      <button class="logout"
              onclick="logout()">
        退出
      </button>

    </div>


    <h2>创建支付订单</h2>

    <label>商户订单号</label>
    <input id="merchantOrderNo"
           type="text"
           placeholder="例如：TEST001">

    <label>支付金额</label>
    <input id="amount"
           type="number"
           step="0.01"
           min="0.01"
           placeholder="例如：10.00">

    <label>币种</label>
    <select id="currency">
      <option value="CNY">CNY</option>
      <option value="USD">USD</option>
    </select>

    <label>支付通道</label>
    <select id="channel">
      <option value="mock">Mock 测试支付</option>
    </select>

    <label>订单标题</label>
    <input id="subject"
           type="text"
           value="PayHub 测试订单">

    <label>有效时间（分钟）</label>
    <input id="expiresMinutes"
           type="number"
           value="30"
           min="1">

    <button onclick="createOrder()">
      创建订单并进入支付
    </button>

    <div id="createStatus"
         class="status"></div>

    <div id="orderBox"
         class="order-box hidden">

      <div class="order-row">
        <span>订单号</span>
        <span id="resultOrderNo">-</span>
      </div>

      <div class="order-row">
        <span>金额</span>
        <span id="resultAmount">-</span>
      </div>

      <div class="order-row">
        <span>状态</span>
        <span id="resultStatus">-</span>
      </div>

      <div class="link-box">
        <div class="small">支付链接</div>
        <div id="resultPayUrl"></div>
      </div>

      <button onclick="goCheckout()">
        立即进入收银台
      </button>

    </div>

  </div>

</div>


<script>

const TOKEN_KEY = "payhub_token";

function getToken(){
  return localStorage.getItem(TOKEN_KEY) || "";
}


function setStatus(id,message,type){

  const el=document.getElementById(id);

  el.textContent=message;

  el.className="status "+(type||"");

}


function showLogin(){

  document.getElementById("loginBox")
    .classList.remove("hidden");

  document.getElementById("registerBox")
    .classList.add("hidden");

  document.getElementById("loginTab")
    .classList.add("active");

  document.getElementById("registerTab")
    .classList.remove("active");

}


function showRegister(){

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("registerBox")
    .classList.remove("hidden");

  document.getElementById("loginTab")
    .classList.remove("active");

  document.getElementById("registerTab")
    .classList.add("active");

}


async function login(){

  const email=
    document.getElementById("loginEmail")
      .value.trim();

  const password=
    document.getElementById("loginPassword")
      .value;

  if(!email || !password){

    setStatus(
      "authStatus",
      "请输入邮箱和密码",
      "error"
    );

    return;
  }

  setStatus(
    "authStatus",
    "正在登录……"
  );

  try{

    const r=await fetch("/api/auth/login",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        email,
        password
      })

    });

    const data=await r.json();

    if(!r.ok){

      throw new Error(
        data.message || "登录失败"
      );

    }

    if(!data.token){

      throw new Error(
        "服务器没有返回登录 Token"
      );

    }

    localStorage.setItem(
      TOKEN_KEY,
      data.token
    );

    setStatus(
      "authStatus",
      "登录成功",
      "success"
    );

    showMerchant(data.user);

  }catch(e){

    setStatus(
      "authStatus",
      e.message || "登录失败",
      "error"
    );

  }

}


async function register(){

  const name=
    document.getElementById("registerName")
      .value.trim();

  const email=
    document.getElementById("registerEmail")
      .value.trim();

  const password=
    document.getElementById("registerPassword")
      .value;

  if(!email || !password){

    setStatus(
      "authStatus",
      "邮箱和密码不能为空",
      "error"
    );

    return;
  }

  if(password.length<6){

    setStatus(
      "authStatus",
      "密码至少需要 6 位",
      "error"
    );

    return;
  }

  setStatus(
    "authStatus",
    "正在注册……"
  );

  try{

    const r=await fetch("/api/auth/register",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        name,
        email,
        password
      })

    });

    const data=await r.json();

    if(!r.ok){

      throw new Error(
        data.message || "注册失败"
      );

    }

    if(!data.token){

      throw new Error(
        "服务器没有返回登录 Token"
      );

    }

    localStorage.setItem(
      TOKEN_KEY,
      data.token
    );

    setStatus(
      "authStatus",
      "注册成功",
      "success"
    );

    showMerchant(data.user);

  }catch(e){

    setStatus(
      "authStatus",
      e.message || "注册失败",
      "error"
    );

  }

}


function showMerchant(user){

  document.getElementById("authCard")
    .classList.add("hidden");

  document.getElementById("merchantCard")
    .classList.remove("hidden");

  if(user){

    document.getElementById("userName")
      .textContent =
        user.name ||
        user.merchantNo ||
        user.email ||
        "PayHub 商户";

  }

}


function logout(){

  localStorage.removeItem(TOKEN_KEY);

  document.getElementById("merchantCard")
    .classList.add("hidden");

  document.getElementById("authCard")
    .classList.remove("hidden");

}


async function createOrder(){

  const token=getToken();

  if(!token){

    document.getElementById("merchantCard")
      .classList.add("hidden");

    document.getElementById("authCard")
      .classList.remove("hidden");

    setStatus(
      "authStatus",
      "请先登录",
      "error"
    );

    return;

  }


  const merchantOrderNo=
    document.getElementById("merchantOrderNo")
      .value.trim();

  const amount=
    Number(
      document.getElementById("amount").value
    );

  const currency=
    document.getElementById("currency").value;

  const channel=
    document.getElementById("channel").value;

  const subject=
    document.getElementById("subject").value.trim()
    || "PayHub 测试订单";

  const expiresMinutes=
    Number(
      document.getElementById("expiresMinutes").value
    ) || 30;


  if(!merchantOrderNo){

    setStatus(
      "createStatus",
      "请输入商户订单号",
      "error"
    );

    return;

  }


  if(!Number.isFinite(amount) || amount<=0){

    setStatus(
      "createStatus",
      "请输入正确的支付金额",
      "error"
    );

    return;

  }


  setStatus(
    "createStatus",
    "正在创建订单……"
  );


  try{

    const r=await fetch("/api/orders",{

      method:"POST",

      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+token
      },

      body:JSON.stringify({

        merchantOrderNo,
        amount,
        currency,
        channel,
        subject,
        expiresMinutes

      })

    });


    const data=await r.json();


    if(r.status===401){

      localStorage.removeItem(TOKEN_KEY);

      document.getElementById("merchantCard")
        .classList.add("hidden");

      document.getElementById("authCard")
        .classList.remove("hidden");

      setStatus(
        "authStatus",
        "登录已经过期，请重新登录",
        "error"
      );

      return;

    }


    if(!r.ok){

      throw new Error(
        data.message || "创建订单失败"
      );

    }


    /*
      服务器应该返回：

      data.orderNo
      data.payUrl
      data.order
    */

    const orderNo=
      data.orderNo ||
      data.order?.orderNo ||
      data.order?.order_no;

    if(!orderNo){

      throw new Error(
        "服务器创建成功，但没有返回订单号"
      );

    }


    /*
      优先使用服务器生成的 payUrl。
      如果没有，则自己根据当前域名生成
      /pay/订单号
    */

    const payUrl=
      data.payUrl ||
      data.order?.payUrl ||
      data.order?.pay_url ||
      (
        window.location.origin +
        "/pay/" +
        encodeURIComponent(orderNo)
      );


    const order=data.order || {};


    document.getElementById("resultOrderNo")
      .textContent=orderNo;

    document.getElementById("resultAmount")
      .textContent=
        order.amount ||
        amount.toFixed(2);

    document.getElementById("resultStatus")
      .textContent=
        order.status ||
        "pending";

    document.getElementById("resultPayUrl")
      .textContent=payUrl;

    document.getElementById("orderBox")
      .classList.remove("hidden");


    setStatus(
      "createStatus",
      "订单创建成功，正在进入收银台……",
      "success"
    );


    /*
      最关键：

      不再停留在 /
      直接进入：

      /checkout/真实订单号
    */

    setTimeout(()=>{

      window.location.href=
        "/checkout/" +
        encodeURIComponent(orderNo);

    },500);


  }catch(e){

    setStatus(
      "createStatus",
      e.message || "创建订单失败",
      "error"
    );

  }

}


function goCheckout(){

  const orderNo=
    document.getElementById("resultOrderNo")
      .textContent.trim();

  if(!orderNo || orderNo==="-" ){

    setStatus(
      "createStatus",
      "没有有效订单号",
      "error"
    );

    return;

  }

  window.location.href=
    "/checkout/" +
    encodeURIComponent(orderNo);

}


async function checkLogin(){

  const token=getToken();

  if(!token){
    return;
  }


  try{

    const r=await fetch(
      "/api/auth/me",
      {
        headers:{
          "Authorization":
            "Bearer "+token
        }
      }
    );


    if(!r.ok){

      localStorage.removeItem(TOKEN_KEY);

      return;

    }


    const data=await r.json();

    showMerchant(data.user);

  }catch(e){

    console.log(
      "登录状态检查失败",
      e
    );

  }

}


checkLogin();

</script>

</body>
</html>
