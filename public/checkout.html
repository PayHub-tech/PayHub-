<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayHub 收银台</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}.top{height:62px;background:#1769ff;color:#fff;display:flex;align-items:center;padding:0 22px;font-size:22px;font-weight:800}.wrap{max-width:560px;margin:38px auto;padding:0 16px}.card{background:#fff;border-radius:18px;box-shadow:0 12px 40px #16325a18;overflow:hidden}.head{padding:28px;border-bottom:1px solid #edf1f7}.merchant{font-size:13px;color:#8490a3}.subject{font-size:20px;font-weight:750;margin-top:9px}.amount{font-size:38px;font-weight:850;color:#1769ff;margin-top:12px}.body{padding:24px 28px}.label{font-size:13px;color:#8490a3;margin-bottom:10px}.channels{display:grid;grid-template-columns:1fr 1fr;gap:12px}.channel{border:1.5px solid #dfe6f0;border-radius:13px;background:#fff;padding:14px;text-align:left;font-weight:700}.channel.active{border-color:#1769ff;background:#f1f6ff;color:#1769ff}.channel small{display:block;color:#8995a8;font-weight:500;margin-top:4px}.pay{width:100%;margin-top:20px;padding:15px;border:0;border-radius:12px;background:#1769ff;color:#fff;font-size:16px;font-weight:800}.pay:disabled{opacity:.55}.meta{font-size:12px;color:#8994a5;line-height:1.8;margin-top:16px}.success,.error{display:none;text-align:center;padding:45px 25px}.icon{font-size:52px}.error{color:#c33}@media(max-width:600px){.wrap{margin:18px auto}.head,.body{padding:22px}.amount{font-size:34px}}</style></head>
<body><div class="top">PayHub</div><div class="wrap"><div class="card">
<div id="main"><div class="head"><div class="merchant">安全支付 · PayHub 收银台</div><div class="subject" id="subject">加载订单中…</div><div class="amount" id="amount">--</div></div>
<div class="body"><div class="label">选择支付方式</div><div class="channels">
<button class="channel active" data-c="mock">💳 测试支付<small>开发环境</small></button>
<button class="channel" data-c="wechat">🟢 微信支付<small>待接入官方通道</small></button>
<button class="channel" data-c="alipay">🔵 支付宝<small>待接入官方通道</small></button>
<button class="channel" data-c="usdt">₮ TRC20 USDT<small>待接入授权通道</small></button></div>
<button class="pay" id="pay">立即支付</button><div class="meta" id="meta"></div></div></div>
<div class="success" id="success"><div class="icon">✓</div><h2>支付成功</h2><div id="successText"></div></div><div class="error" id="error"></div>
</div></div>
<script>
const no=new URLSearchParams(location.search).get("order"),$=x=>document.getElementById(x);
document.querySelectorAll(".channel").forEach(b=>b.onclick=()=>{document.querySelectorAll(".channel").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("pay").disabled=b.dataset.c!=="mock";$("pay").textContent=b.dataset.c==="mock"?"立即支付":"等待真实通道接入"});
async function load(){try{if(!no)throw Error("缺少订单号");let r=await fetch("/api/checkout/"+encodeURIComponent(no)),d=await r.json();if(!r.ok)throw Error(d.message);let o=d.order;$("subject").textContent=o.subject;$("amount").textContent=o.amount+" "+o.currency;$("meta").innerHTML="订单号："+o.orderNo+"<br>商户订单号："+o.merchantOrderNo+"<br>有效期："+new Date(o.expiredAt).toLocaleString();if(o.status==="paid")ok(o)}catch(e){$("main").style.display="none";$("error").style.display="block";$("error").textContent=e.message}}
$("pay").onclick=async()=>{try{$("pay").disabled=true;$("pay").textContent="支付处理中…";let r=await fetch("/api/checkout/"+encodeURIComponent(no)+"/pay",{method:"POST"}),d=await r.json();if(!r.ok)throw Error(d.message);ok(d.order)}catch(e){alert(e.message);$("pay").disabled=false;$("pay").textContent="立即支付"}};
function ok(o){$("main").style.display="none";$("success").style.display="block";$("successText").textContent="订单 "+o.orderNo+" 已完成支付。"}load();
</script></body></html>
