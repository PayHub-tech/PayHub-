<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PayHub 收银台</title>

<style>

*{
 box-sizing:border-box
}

body{
 margin:0;
 background:#f4f7fb;
 color:#172033;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

.top{
 height:62px;
 background:#1769ff;
 color:white;
 display:flex;
 align-items:center;
 padding:0 22px;
 font-size:22px;
 font-weight:800;
}

.wrap{
 max-width:560px;
 margin:40px auto;
 padding:0 16px;
}

.card{
 background:white;
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 12px 40px rgba(0,0,0,.08);
}

.head{
 padding:28px;
 border-bottom:1px solid #edf1f7;
}

.merchant{
 font-size:13px;
 color:#8490a3;
}

.subject{
 font-size:20px;
 font-weight:800;
 margin-top:10px;
}

.amount{
 font-size:38px;
 font-weight:900;
 color:#1769ff;
 margin-top:12px;
}

.body{
 padding:25px 28px;
}

.label{
 color:#8490a3;
 font-size:13px;
 margin-bottom:12px;
}

.channels{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.channel{
 border:1.5px solid #dfe6f0;
 background:white;
 border-radius:14px;
 padding:14px;
 text-align:left;
 font-weight:700;
 cursor:pointer;
}

.channel.active{
 border-color:#1769ff;
 background:#f1f6ff;
 color:#1769ff;
}

.channel small{
 display:block;
 margin-top:5px;
 color:#8995a8;
 font-weight:500;
}

.pay{
 width:100%;
 margin-top:22px;
 padding:15px;
 border:0;
 border-radius:13px;
 background:#1769ff;
 color:white;
 font-size:16px;
 font-weight:800;
 cursor:pointer;
}

.pay:disabled{
 opacity:.5;
}

.meta{
 margin-top:18px;
 color:#8995a8;
 font-size:12px;
 line-height:1.8;
}

.success{
 display:none;
 padding:50px 25px;
 text-align:center;
}

.success .icon{
 font-size:55px;
 color:#18a558;
}

.error{
 display:none;
 padding:45px 25px;
 text-align:center;
 color:#d33;
}

@media(max-width:600px){

.wrap{
 margin:18px auto;
}

.head,.body{
 padding:22px;
}

.amount{
 font-size:34px;
}

}

</style>

</head>


<body>


<div class="top">
 PayHub
</div>


<div class="wrap">

<div class="card">


<div id="main">


<div class="head">

<div class="merchant">
安全支付 · PayHub 收银台
</div>


<div class="subject" id="subject">
加载订单中...
</div>


<div class="amount" id="amount">
--
</div>


</div>



<div class="body">


<div class="label">
选择支付方式
</div>



<div class="channels">


<button class="channel active" data-channel="mock">
💳 测试支付
<small>开发环境</small>
</button>


<button class="channel" data-channel="wechat">
🟢 微信支付
<small>待接入</small>
</button>


<button class="channel" data-channel="alipay">
🔵 支付宝
<small>待接入</small>
</button>


<button class="channel" data-channel="usdt">
₮ USDT TRC20
<small>待接入</small>
</button>


</div>



<button id="pay" class="pay">
立即支付
</button>



<div class="meta" id="meta"></div>



</div>


</div>



<div id="success" class="success">

<div class="icon">
✓
</div>

<h2>
支付成功
</h2>

<div id="successText"></div>

</div>



<div id="error" class="error"></div>



</div>

</div>
<script>

const $ = id => document.getElementById(id);


/*
  获取订单号
  支持：
  1. /checkout/PHO123456
  2. /checkout.html?order=PHO123456
  3. /checkout.html?orderNo=PHO123456
*/

let orderNo =
  new URLSearchParams(location.search).get("order")
  ||
  new URLSearchParams(location.search).get("orderNo")
  ||
  "";


if(!orderNo){

  const parts =
    location.pathname
    .split("/")
    .filter(Boolean);

  if(parts[0]==="checkout" && parts[1]){
    orderNo =
      decodeURIComponent(parts[1]);
  }

}


console.log("PayHub Order:",orderNo);



let currentChannel="mock";



/*
 支付方式选择
*/

document
.querySelectorAll(".channel")
.forEach(btn=>{

 btn.onclick=()=>{

  document
  .querySelectorAll(".channel")
  .forEach(x=>{
    x.classList.remove("active");
  });


  btn.classList.add("active");


  currentChannel =
    btn.dataset.channel;


  if(currentChannel==="mock"){

    $("pay").disabled=false;
    $("pay").innerText="立即支付";

  }else{

    $("pay").disabled=true;
    $("pay").innerText="等待真实通道接入";

  }

 };


});





/*
 加载订单
*/

async function loadOrder(){


 try{


  if(!orderNo){

    throw new Error(
      "缺少订单号，请检查支付链接"
    );

  }



  const res =
    await fetch(
      "/api/checkout/" +
      encodeURIComponent(orderNo)
    );


  const data =
    await res.json();



  if(!res.ok){

    throw new Error(
      data.message ||
      "订单不存在"
    );

  }



  const order =
    data.order;



  $("subject").innerText =
    order.subject ||
    "PayHub订单";


  $("amount").innerText =
    order.amount +
    " " +
    order.currency;



  $("meta").innerHTML =
    `
    订单号：${order.orderNo}
    <br>
    商户订单号：${order.merchantOrderNo}
    <br>
    状态：${order.status}
    <br>
    有效期：
    ${new Date(order.expiredAt)
      .toLocaleString()}
    `;



  if(order.status==="paid"){

    success(order);

  }



 }catch(e){


  $("main").style.display="none";

  $("error").style.display="block";

  $("error").innerText =
    e.message;


 }


}






/*
 Mock支付
*/


$("pay").onclick =
async()=>{


 try{


  $("pay").disabled=true;

  $("pay").innerText =
    "支付处理中...";



  const res =
    await fetch(
      "/api/checkout/" +
      encodeURIComponent(orderNo),
      {

       method:"POST",

       headers:{
        "Content-Type":
        "application/json"
       },

       body:JSON.stringify({

        channel:"mock"

       })

      }
    );



  const data =
    await res.json();



  if(!res.ok){

    throw new Error(
      data.message ||
      "支付失败"
    );

  }



  success(
    data.order
  );



 }catch(e){


  alert(e.message);


  $("pay").disabled=false;

  $("pay").innerText =
    "立即支付";


 }


};






function success(order){


 $("main").style.display =
 "none";


 $("success").style.display =
 "block";



 $("successText").innerHTML =
 `
订单：
${order.orderNo}
<br>
支付完成
 `;


}




loadOrder();


</script>

</body>
</html>
