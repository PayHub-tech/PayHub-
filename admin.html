<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayHub 管理后台</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#172033;background:#f4f7fb}button,input,select{font:inherit}.top{height:64px;background:#0b5cff;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{font-weight:800;font-size:21px}.wrap{max-width:1280px;margin:22px auto;padding:0 16px}.login{max-width:420px;margin:90px auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 40px #102a4d12}.login h1{margin-top:0}.input{width:100%;padding:12px;border:1px solid #dce3ee;border-radius:10px;margin:8px 0}.btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer}.primary{background:#0b5cff;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 22px #102a4d0a;margin-bottom:16px}.num{font-size:26px;font-weight:800;margin-top:7px}.muted{color:#718096;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{background:#fff;border:1px solid #dce3ee;padding:10px 14px;border-radius:10px;cursor:pointer}.tab.active{background:#0b5cff;color:#fff}.section{display:none}.section.active{display:block}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}th{color:#718096}.pill{padding:4px 8px;border-radius:999px;background:#edf4ff;color:#0b5cff}.danger{background:#fff0f0;color:#c53030}.ok{background:#eafaf0;color:#22864a}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.notice{padding:10px;background:#fff8e7;border:1px solid #ffe3a3;border-radius:10px;color:#8a6200}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.top{padding:0 14px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.wrap{padding:0 10px}.card{padding:14px}}
</style></head><body><div id="login" class="login"><h1>PayHub 管理后台</h1><p class="muted">平台管理员入口 · 开发环境</p><input id="email" class="input" value="admin@payhub.local" placeholder="管理员邮箱"><input id="password" class="input" type="password" value="Admin123!" placeholder="密码"><button class="btn primary" style="width:100%;margin-top:8px" onclick="login()">登录管理后台</button><p id="err" style="color:#c53030"></p></div>
<div id="app" class="hidden"><div class="top"><div class="brand">PayHub Admin</div><button class="btn" onclick="logout()">退出</button></div><div class="wrap"><div class="grid"><div class="card"><div class="muted">商户总数</div><div id="m" class="num">-</div></div><div class="card"><div class="muted">活跃商户</div><div id="a" class="num">-</div></div><div class="card"><div class="muted">累计已支付</div><div id="p" class="num">-</div></div><div class="card"><div class="muted">待审核结算</div><div id="s" class="num">-</div></div></div><div class="tabs"><button class="tab active" onclick="show('merchants',this)">商户审核</button><button class="tab" onclick="show('orders',this)">订单监控</button><button class="tab" onclick="show('settlements',this)">提现审核</button><button class="tab" onclick="show('risk',this)">风控</button><button class="tab" onclick="show('reconcile',this)">对账</button><button class="tab" onclick="show('audit',this)">操作日志</button></div>
<div id="merchants" class="section active card"><h2>商户审核 / 状态管理</h2><div class="tablewrap"><table><thead><tr><th>商户</th><th>邮箱</th><th>余额</th><th>状态</th><th>操作</th></tr></thead><tbody id="mt"></tbody></table></div></div>
<div id="orders" class="section card"><h2>全平台订单</h2><div class="tablewrap"><table><thead><tr><th>订单号</th><th>商户</th><th>金额</th><th>渠道</th><th>状态</th><th>时间</th></tr></thead><tbody id="ot"></tbody></table></div></div>
<div id="settlements" class="section card"><h2>提现 / 结算审核</h2><div class="tablewrap"><table><thead><tr><th>结算单</th><th>商户</th><th>金额</th><th>手续费</th><th>账户</th><th>状态</th><th>操作</th></tr></thead><tbody id="st"></tbody></table></div></div>
<div id="risk" class="section card"><h2>风险标记</h2><div class="row"><input id="riskMid" class="input" style="max-width:160px" placeholder="商户ID"><select id="riskLevel" class="input" style="max-width:140px"><option>low</option><option selected>medium</option><option>high</option></select><input id="riskReason" class="input" style="max-width:360px" placeholder="风险原因"><button class="btn primary" onclick="addRisk()">添加标记</button></div><div class="tablewrap"><table><thead><tr><th>商户</th><th>级别</th><th>原因</th><th>状态</th><th>时间</th></tr></thead><tbody id="rt"></tbody></table></div></div>
<div id="reconcile" class="section card"><h2>资金对账</h2><div class="notice">V12 提供平台级对账快照。生产环境还应接入支付机构对账单、结算单与自动差错处理。</div><button class="btn primary" style="margin-top:12px" onclick="runRecon()">立即生成对账快照</button><pre id="rec" style="white-space:pre-wrap"></pre></div>
<div id="audit" class="section card"><h2>管理员操作日志</h2><div class="tablewrap"><table><thead><tr><th>操作</th><th>目标</th><th>详情</th><th>时间</th></tr></thead><tbody id="auditT"></tbody></table></div></div>
</div></div><script>
const token=()=>localStorage.getItem('payhub_admin_token');
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(token()||''),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||'请求失败');return d}
async function login(){try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.message);localStorage.setItem('payhub_admin_token',d.token);location.reload()}catch(e){err.textContent=e.message}}
function logout(){localStorage.removeItem('payhub_admin_token');location.reload()}
function show(id,el){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');load(id)}
async function load(id){try{if(id==='merchants')loadMerchants();if(id==='orders')loadOrders();if(id==='settlements')loadSettlements();if(id==='risk')loadRisk();if(id==='audit')loadAudit()}catch(e){console.error(e)}}
async function boot(){if(!token())return;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');const x=await api('/api/admin/stats');m.textContent=x.merchants;a.textContent=x.active;p.textContent='¥'+x.totalPaid;s.textContent='¥'+x.pendingSettlement;loadMerchants()}
async function loadMerchants(){const x=await api('/api/admin/merchants');mt.innerHTML=x.items.map(v=>`<tr><td>${v.merchant_no}<br><span class="muted">${v.name}</span></td><td>${v.email}</td><td>¥${v.balance}</td><td><span class="pill ${v.status==='suspended'?'danger':v.status==='active'?'ok':''}">${v.status}</span></td><td><button class="btn" onclick="setStatus(${v.id},'active')">启用</button> <button class="btn" onclick="setStatus(${v.id},'suspended')">冻结</button> <button class="btn" onclick="markRisk(${v.id})">标风险</button></td></tr>`).join('')}
async function setStatus(id,status){await api('/api/admin/merchants/'+id+'/status',{method:'POST',body:JSON.stringify({status})});loadMerchants()}
async function markRisk(id){const reason=prompt('风险原因','管理员人工标记');if(!reason)return;await api('/api/admin/merchants/'+id+'/risk',{method:'POST',body:JSON.stringify({level:'medium',reason})});alert('已标记')}
async function loadOrders(){const x=await api('/api/admin/orders');ot.innerHTML=x.items.map(v=>`<tr><td>${v.order_no}<br><span class="muted">${v.merchant_order_no}</span></td><td>${v.merchant_no}<br>${v.merchant_name}</td><td>¥${v.amount}</td><td>${v.channel}</td><td>${v.status}</td><td>${v.created_at}</td></tr>`).join('')}
async function loadSettlements(){const x=await api('/api/admin/settlements');st.innerHTML=x.items.map(v=>`<tr><td>${v.settlement_no}</td><td>${v.merchant_no}<br>${v.merchant_name}</td><td>¥${Number(v.amount).toFixed(2)}</td><td>¥${Number(v.fee).toFixed(2)}</td><td>${v.bank_name||''}<br>${v.account_no_masked||''}</td><td>${v.status}</td><td>${v.status==='pending'?`<button class="btn" onclick="review('${v.settlement_no}','approve')">通过</button> <button class="btn" onclick="review('${v.settlement_no}','reject')">拒绝</button>`:''}</td></tr>`).join('')}
async function review(no,action){if(!confirm(action==='approve'?'确认通过该结算？':'确认拒绝并退回余额？'))return;await api('/api/admin/settlements/'+no+'/review',{method:'POST',body:JSON.stringify({action})});loadSettlements();boot()}
async function loadRisk(){const x=await api('/api/admin/risk-flags');rt.innerHTML=x.items.map(v=>`<tr><td>${v.merchant_no} ${v.merchant_name}</td><td>${v.level}</td><td>${v.reason}</td><td>${v.status}</td><td>${v.created_at}</td></tr>`).join('')}
async function addRisk(){const id=Number(riskMid.value);if(!id)return alert('请输入商户ID');await api('/api/admin/merchants/'+id+'/risk',{method:'POST',body:JSON.stringify({level:riskLevel.value,reason:riskReason.value||'人工标记'})});loadRisk()}
async function runRecon(){const x=await api('/api/admin/reconciliation/run',{method:'POST'});rec.textContent=JSON.stringify(x,null,2)}
async function loadAudit(){const x=await api('/api/admin/audit-logs');auditT.innerHTML=x.items.map(v=>`<tr><td>${v.action}</td><td>${v.target_type||''} ${v.target_id||''}</td><td>${v.detail||''}</td><td>${v.created_at}</td></tr>`).join('')}
boot();
</script></body></html>
